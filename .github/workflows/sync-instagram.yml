name: Sync Instagram

on:
  schedule:
    - cron: "17 7 * * *"   # daily, 07:17 UTC
  workflow_dispatch:        # or run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-instagram
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet Pillow

      - name: Pull latest posts
        env:
          BEHOLD_FEED_URL: ${{ vars.BEHOLD_FEED_URL }}
          POST_LIMIT: "12"
        run: python tools/sync_instagram.py

      - name: Commit any changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet --staged; then
            echo "No change."
          else
            git commit -m "Sync photographs from @jgreerfilm"
            git push
          fi
